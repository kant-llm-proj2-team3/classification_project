[project]
name = "classification_project"
version = "0.1.0"
description = "KANT 프로젝트2 - 3조(권오륜, 송찬영, 이정원, 최선영)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7,<3",
  "transformers>=4.51,<5",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.6,<2",
  "numpy>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "langchain-core>=0.3.60,<2",
  "openai>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
#testpaths = ["tests/test_lesson_training.py", "tests/test_lesson_service.py"]
pythonpath = ["steps"]

[tool.ruff]
line-length = 100
target-version = "py312"
